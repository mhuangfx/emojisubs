<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Font directory -->
  <dir>.</dir>

  <!-- Font aliases to match our app's font names -->
  <alias>
    <family>Montserrat</family>
    <prefer>
      <family>Montserrat</family>
    </prefer>
  </alias>

  <alias>
    <family>Pacifico</family>
    <prefer>
      <family>Pacifico</family>
    </prefer>
  </alias>

  <alias>
    <family>Bebas Neue</family>
    <prefer>
      <family>BebasNeue</family>
    </prefer>
  </alias>

  <alias>
    <family>Bangers</family>
    <prefer>
      <family>Bangers</family>
    </prefer>
  </alias>

  <alias>
    <family>Comfortaa</family>
    <prefer>
      <family>Comfortaa</family>
    </prefer>
  </alias>

  <alias>
    <family>Orbitron</family>
    <prefer>
      <family>Orbitron</family>
    </prefer>
  </alias>
</fontconfig>
